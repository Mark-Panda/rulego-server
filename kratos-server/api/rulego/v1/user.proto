syntax = "proto3";

package api.rulego.v1;

import "google/api/annotations.proto";

option go_package = "kratos-server/api/rulego/v1;v1";

// 用户服务
service UserService {
    // 用户登录
    rpc Login(LoginRequest) returns (LoginResponse) {
        option (google.api.http) = {
            post: "/api/v1/login"
            body: "*"
        };
    }

    // 验证Token
    rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse) {
        option (google.api.http) = {
            post: "/api/v1/verify-token"
            body: "*"
        };
    }
}

// 登录请求
message LoginRequest {
    string username = 1;
    string password = 2;
}

// 登录响应
message LoginResponse {
    string token     = 1;
    string username  = 2;
    int64 expires_at = 3;
}

// 验证Token请求
message VerifyTokenRequest {
    string token = 1;
}

// 验证Token响应
message VerifyTokenResponse {
    bool valid       = 1;
    string username  = 2;
    int64 expires_at = 3;
}